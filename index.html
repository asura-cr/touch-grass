<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Grass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }

        .gamefont {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .wooden-card {
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            border: 2px solid #5a442e;
            box-shadow: 0 4px 0 #3b2b1a, 0 8px 16px rgba(45, 30, 15, 0.18);
            position: relative;
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            cursor: pointer;
            transition: transform 150ms ease;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);

        }

        .actions {
            display: flex;
            align-items: center;
            gap: 12px;

        }

        .wooden-card.title {
            margin-right: auto;
            width: fit-content;

        }

        .wooden-card.profile {
            width: 220px;
            font-size: 0.6rem;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .level {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .exp-bar {
            width: 100%;
            height: 10px;
            background: #646464;
            border-radius: 4px;
            overflow: hidden;
        }

        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #41bf14 0%, #055203 100%);
            border-radius: 4px;
            transition: width 0.3s ease-in-out;
        }

        .wooden-card:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 0 #3b2d1d, 0 4px 8px rgba(45, 30, 15, 0.15);
        }

        .wooden-card:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #3e2d1d;
        }

        .profilepic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a442e;
            flex-shrink: 0;
            margin-right: auto;
        }

        .profile-d {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            width: 100%;
            margin-right: auto;
        }

        .wooden-card.settings {
            width: auto;
            padding: 8px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wooden-card.settings .icon {
            width: 20px;
            height: 20px;
            fill: #000000;
            flex-shrink: 0;
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 1000;
        }

        .hud .wooden-card {
            pointer-events: auto;
        }

        .nav {
            position: fixed;
            bottom: 24px;
            align-items: center;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            border: 3.5px solid #23513b;
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            border-radius: 16px;
            padding: 6px 10px;
            box-shadow: 0 4px 0 #3b2b1a, 0 6px 16px rgba(0,0,0,0.12);
            z-index: 100;
        }

        .nav-b{
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 10px 22px 14px;
            cursor: pointer;
            border-radius: 28px;
            color: #928370;
            transition: all 0.2s ease-in-out;
            ;

            .nav-b:hover {
                background: rgb(74,62,49);
            }

            .nav-b.active {
                background:linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
                color: #173b28;
                box-shadow: inset 0 0 0 2px rgba(0,0,0,0.04);
            }

            .nav-b.active .active-indicator {
                position:absolute;
                bottom: 6px;
                width: 26px;
                height: 3px;
                background: #21603f;
                border-radius: 4px;
            }
            .icon-warp {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .map-icon {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }

            .notif-dot {
                position: absolute;
                top: -2px;
                right: -4px;
                width: 8px;
                height: 8px;
                background: #c98836;
                border-radius: 50%;
                display: none;
            }

        }
    </style>
</head>

<body>
    <div class="map">
    </div>
    <header class="hud">
        <div class="wooden-card title">
            <h1 class="gamefont">Touch Grass</h1>
        </div>
        <div class="actions">
            <div class="wooden-card profile">
                <img src="profile.jpg" alt="Profile Picture" class="profilepic">
                <div class="profile-d">
                    <span class="gamefont" style="font-weight: bold;">Name</span>
                    <div class="level">
                        <span class="gamefont">Level 1</span>
                        <span class="gamefont xp">XP 10/100</span>
                    </div>
                    <div class="exp-bar">
                        <div class="exp-bar-fill" style="width: 50%;">
                        </div>
                    </div>
                </div>
            </div>


            <button class="wooden-card settings">
                <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path

                        data-spm-anchor-id="a313x.search_index.0.i0.40a93a81w1AXrL"></path>
                </svg>
            </button>
        </div>
    </header>

    <nav class="nav">

        <!-- Map -->
        <button class="nav-b active">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M9 3L3 6v14l6-3 6 3 6-3V3l-6 3-6-3zM5 7.3l3-1.5v11.4l-3 1.5V7.3zm5.5 9.9V5.8l5 2.5v11.4l-5-2.5zm6.5 0V5.8l2-1v11.4l-2 1z" />
                </svg>
                <span class="notif-dot"></span>
            </div>
            <span class="gamefont nav-text">Map</span>
            <span class="active-ind">Map</span>
        </button>

        <!-- Jounal -->
        <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 3H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H9v-2h8v2zm0-4H9v-2h8v2zm0-4H9V7h8v2z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Journal</span>
        </button>

        <!-- Friends -->
        <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>
            <span class="gamefont nav-text">Friends</span>
        </button>

        <!-- Achievements / or some shit ill change lter-->
                 <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
            </div>
            <span class="gamefont nav-text">Achievements</span>
        </button>
    </nav>
</body>

</html>
