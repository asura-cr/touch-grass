<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Grass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="map">
    </div>
    <header class="hud">
        <div class="wooden-card title">
            <h1 class="gamefont">Touch Grass</h1>
        </div>
        <div class="actions">
            <div class="wooden-card profile">
                <img src="profile.jpg" id="ppic" alt="Profile Picture" class="pfp">
                <div class="profile-d">
                    <span class="gamefont" id="pname" style="font-weight: bold;">Name</span>
                    <div class="level">
                        <span class="gamefont" id="plevel">Level 1</span>
                        <span class="gamefont xp" id="pxp">XP 10/100</span>
                    </div>
                    <div class="exp-bar">
                        <div class="exp-bar-fill" id="pbar" style="width: 0%;">
                        </div>
                    </div>
                </div>
            </div>


            <button class="wooden-card settings" id="settingsbtn">
                <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M793.6 678.4c29.866667-51.2 81.066667-76.8 132.266667-72.533333 8.533333-29.866667 12.8-64 12.8-98.133334 0-29.866667-4.266667-59.733333-8.533334-85.333333-51.2 8.533333-106.666667-21.333333-136.533333-72.533333-29.866667-51.2-25.6-115.2 8.533333-153.6-46.933333-42.666667-98.133333-72.533333-157.866666-93.866667-17.066667 51.2-68.266667 85.333333-132.266667 85.333333s-110.933333-34.133333-132.266667-85.333333c-59.733333 21.333333-110.933333 55.466667-157.866666 98.133333 34.133333 42.666667 38.4 102.4 8.533333 153.6-29.866667 51.2-85.333333 76.8-136.533333 68.266667-4.266667 29.866667-8.533333 59.733333-8.533334 89.6 0 34.133333 4.266667 64 12.8 93.866667 51.2-4.266667 102.4 21.333333 132.266667 72.533333 25.6 51.2 25.6 106.666667-4.266667 149.333333 46.933333 42.666667 98.133333 72.533333 157.866667 89.6 21.333333-46.933333 68.266667-76.8 128-76.8s106.666667 29.866667 128 76.8c59.733333-17.066667 110.933333-51.2 157.866667-89.6-29.866667-42.666667-34.133333-98.133333-4.266667-149.333333z m-281.6 17.066667c-102.4 0-183.466667-81.066667-183.466667-183.466667S409.6 328.533333 512 328.533333s183.466667 81.066667 183.466667 183.466667-81.066667 183.466667-183.466667 183.466667z"
                        data-spm-anchor-id="a313x.search_index.0.i0.40a93a81w1AXrL"></path>
                </svg>
            </button>
        </div>
    </header>

    <nav class="nav">

        <!-- Map -->
        <button class="nav-b active" data-view="map">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M9 3L3 6v14l6-3 6 3 6-3V3l-6 3-6-3zM5 7.3l3-1.5v11.4l-3 1.5V7.3zm5.5 9.9V5.8l5 2.5v11.4l-5-2.5zm6.5 0V5.8l2-1v11.4l-2 1z" />
                </svg>
                <span class="notif-dot"></span>
            </div>
            <span class="gamefont nav-text">Map</span>
            <span class="active-ind"></span>
        </button>

        <!-- Jounal -->
        <button class="nav-b" data-view="journal">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 3H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H9v-2h8v2zm0-4H9v-2h8v2zm0-4H9V7h8v2z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Journal</span>
            <span class="active-ind"></span>
        </button>

        <!-- Friends -->
        <button class="nav-b" data-view="friends">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Friends</span>
            <span class="active-ind"></span>
        </button>

        <!-- Achievements / or some shit ill change lter-->
        <button class="nav-b" data-view="achievements">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Achievements</span>
            <span class="active-ind"></span>
        </button>
    </nav>

    <div id="pins"></div>

    <div class="mission-card" id="missioncard">
        <div class="mission-thumb-wrap">
            <img id="mission-thumb" src="" alt="MissionLocation" class="mission-thumb" />
        </div>

        <div class="mission-info">
            <span class="gamefont lvlbadge" id="lvlbadge"></span>
            <h2 class="gamefont title" id="title"></h2>
        </div>

        <div class="dist-row">
            <svg class="dist-icon" viewBox="0 0 24 24">
                <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
            <span class="dist-text" id="distance"></span>
        </div>

        <p class="desc" id="desc"></p>

        <div class="reward">
            <svg class="leaf-icon" viewBox="0 0 24 24">
                <path
                    d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.22V8c4.25-1 8-1 8-1s-3.5 1.5-6.5 3c-.5.25-.8.5-1 .78C8.5 16 11 18 16 17c1.5-.3 3.5-1.5 4.5-2.5-1 .5-2 1-3.5 1.5z" />
            </svg>
            <span class="reward-text" id="xp"></span>
        </div>

        <button class="start-btn" id="startbtn">
            <span class="gamefont">Accept</span>
        </button>
    </div>

    <div class="wooden-card active-bar" id="active">
        <span class="gamefont" id="active-text"></span>
        <button class="start-btn" id="completebtn">
            <span class="gamefont">Complete</span>
        </button>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="wooden-card modal-box">
            <div class="modal-head">
                <h2 class="gamefont" id="modal-title"></h2>
                <button class="start-btn" id="modal-close">
                    <span class="gamefont">Close</span>
                </button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
