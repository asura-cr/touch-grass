<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Touch Grass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
        }

        .gamefont {
            font-family: 'Fredoka', cursive, sans-serif;
        }

        .map {
            width: 100vw;
            height: 100vh;
        }

        .wooden-card {
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            border: 2px solid #5a442e;
            box-shadow: 0 4px 0 #3b2b1a, 0 8px 16px rgba(45, 30, 15, 0.18);
            border-radius: 16px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: transform 150ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 150ms cubic-bezier(0.4, 0, 0.2, 1);

        }

        button.wooden-card {
            cursor: pointer;
        }

        button.wooden-card:hover {
            transform: translateY(2px);
        }

        button.wooden-card:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 0 #3b2d1d, 0 4px 8px rgba(45, 30, 15, 0.15);
        }


        .actions {
            display: flex;
            align-items: center;
            gap: 12px;

        }

        .wooden-card.profile {
            width: 220px;
            font-size: 0.6rem;
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .wooden-card:active {
            transform: translateY(-1px);
            box-shadow: 0 2px 0 #3b2d1d, 0 4px 8px rgba(45, 30, 15, 0.15);
        }

        .wooden-card:hover {
            transform: translateY(2px);
        }

        .level {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exp-bar {
            height: 10px;
            background: #646464;
            border-radius: 4px;
            overflow: hidden;
        }

        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #41bf14 0%, #055203 100%);
            transition: width 0.3s ease-in-out;
        }


        .profilepic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #5a442e;
            flex-shrink: 0;
        }

        .profile-d {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .wooden-card.settings {
            padding: 8px 12px;
        }

        .wooden-card.settings .icon {
            width: 20px;
            height: 20px;
            fill: #000000;
            flex-shrink: 0;
        }

        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
            z-index: 1000;
        }

        .hud .wooden-card {
            pointer-events: auto;
        }

        .nav {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            border: 3.5px solid #23513b;
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            border-radius: 16px;
            padding: 6px 10px;
            box-shadow: 0 4px 0 #3b2b1a, 0 6px 16px rgba(0, 0, 0, 0.12);
            z-index: 100;
        }

        .nav-b {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            padding: 10px 22px 14px;
            cursor: pointer;
            border-radius: 28px;
            color: #928370;
            transition: all 0.2s ease-in-out;
        }


        .nav-b:hover {
            background: rgb(74, 62, 49);
        }

        .nav-b.active {
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            color: #173b28;
            box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.04);
        }

        .nav-b.active .active-ind {
            position: absolute;
            bottom: 6px;
            width: 26px;
            height: 3px;
            background: #21603f;
            border-radius: 4px;
        }

        .icon-warp {
            position: relative;
            display: flex;
        }

        .map-icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .notif-dot {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 8px;
            height: 8px;
            background: #c98836;
            border-radius: 50%;
            display: none;
        }


        .level-pin {
            display: flex;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
            transition: ease-in-out 0.2s;
            position: absolute;
            top: 40%;
            left: 50%;
            translate: -50% 0;
        }

        .level-pin:hover {
            transform: translateY(-2px) scale(1.02);
        }

        .level-pin:active {
            transform: translateY(-1px) scale(0.98);
        }

        .wooden-sign {
            position: relative;
            background: #e8bc78;
            border: 3px solid #5a381e;
            border-radius: 12px;
            padding: 8px 24px;
        }

        .nail {
            position: absolute;
            width: 5px;
            height: 5px;
            background: #5a381e;
            border-radius: 50%;
        }

        .nail.tl {
            top: 8px;
            left: 4px;
        }

        .nail.tr {
            top: 8px;
            right: 4px;
        }

        .nail.bl {
            bottom: 8px;
            left: 4px;
        }

        .nail.br {
            bottom: 8px;
            right: 4px;
        }

        .node {
            height: 50px;
            border-radius: 50%;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            aspect-ratio: 1/1;
        }

        .rim {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(180deg, #fff2ad 0%, #f3ba3a 40%, #c48011 85%, #844c06 100%);
            border: 3px solid #5a381e;
            align-items: center;
            justify-content: center;
            display: flex;

        }

        .face {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #e8a327 0%, #cb8412 70%, #a46408 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #5a381e;

        }


        .node-no {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;

        }


        .mission-card {
            position: absolute;
            top: 50%;
            right: 0%;
            transform: translateX(-50%) translateY(calc(-50% + 120%));
            background: linear-gradient(180deg, #fbf7ee 0%, #ede1cc 100%);
            border: 2px solid #234c38;
            box-shadow: 0 4px 0 #3b2b1a, 0 8px 16px rgba(45, 30, 15, 0.18);
            border-radius: 20px;
            padding: 16px 16px 20px;
            display: flex;
            flex-direction: column;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            width: 320px;
            transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
        }

        .mission-card.open {
            transform: translateX(-50%) translateY(-50%);
            opacity: 1;
            pointer-events: auto;
        }

        .mission-thumb-wrap {
            height: 120px;
            border-radius: 12px;
            margin-bottom: 12px;
            overflow: hidden;
            border: 1px solid #234c3733;
            background: #d4c3a8;
        }

        .mission-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .mission-info {
            display: flex;
            flex-direction: column;
            padding: 14px 6px 0;
        }

        .lvlbadge {
            color: #3b533f;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .mission-info .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #173b28;
            margin: 0;
        }

        .dist-row {
            display: flex;
            align-items: center;
            margin-top: 8px;
            gap: 6px;
            color: #7b6a56;
        }

        .dist-icon {
            width: 16px;
            height: 16px;
            fill: #7b6a56;
            flex-shrink: 0;
        }

        .dist-text {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .desc {
            font-size: 0.9rem;
            color: #5a442e;
            margin: 12px 0 16px;
            line-height: 1.4;
        }


        .reward {
            background: #f9ebd3;
            border: 1.5px solid #d1b895;
            border-radius: 12px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .leaf-icon {
            width: 20px;
            height: 20px;
            fill: #41bf14;
            flex-shrink: 0;
        }

        .reward-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: black;
        }

        .start-btn {
            background: linear-gradient(180deg, #377d52 0%, #225a38 100%);
            border: 2px solid #234c38;
            border-radius: 12px;
            padding: 10px 20px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 150ms ease;
        }

        .start-btn:active {
            transform: translateY(3px);
        }
    </style>
</head>

<body>
    <div class="map">
    </div>
    <header class="hud">
        <div class="wooden-card title">
            <h1 class="gamefont">Touch Grass</h1>
        </div>
        <div class="actions">
            <div class="wooden-card profile">
                <img src="profile.jpg" alt="Profile Picture" class="profilepic">
                <div class="profile-d">
                    <span class="gamefont" style="font-weight: bold;">Name</span>
                    <div class="level">
                        <span class="gamefont">Level 1</span>
                        <span class="gamefont xp">XP 10/100</span>
                    </div>
                    <div class="exp-bar">
                        <div class="exp-bar-fill" style="width: 50%;">
                        </div>
                    </div>
                </div>
            </div>


            <button class="wooden-card settings">
                <svg class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M793.6 678.4c29.866667-51.2 81.066667-76.8 132.266667-72.533333 8.533333-29.866667 12.8-64 12.8-98.133334 0-29.866667-4.266667-59.733333-8.533334-85.333333-51.2 8.533333-106.666667-21.333333-136.533333-72.533333-29.866667-51.2-25.6-115.2 8.533333-153.6-46.933333-42.666667-98.133333-72.533333-157.866666-93.866667-17.066667 51.2-68.266667 85.333333-132.266667 85.333333s-110.933333-34.133333-132.266667-85.333333c-59.733333 21.333333-110.933333 55.466667-157.866666 98.133333 34.133333 42.666667 38.4 102.4 8.533333 153.6-29.866667 51.2-85.333333 76.8-136.533333 68.266667-4.266667 29.866667-8.533333 59.733333-8.533334 89.6 0 34.133333 4.266667 64 12.8 93.866667 51.2-4.266667 102.4 21.333333 132.266667 72.533333 25.6 51.2 25.6 106.666667-4.266667 149.333333 46.933333 42.666667 98.133333 72.533333 157.866667 89.6 21.333333-46.933333 68.266667-76.8 128-76.8s106.666667 29.866667 128 76.8c59.733333-17.066667 110.933333-51.2 157.866667-89.6-29.866667-42.666667-34.133333-98.133333-4.266667-149.333333z m-281.6 17.066667c-102.4 0-183.466667-81.066667-183.466667-183.466667S409.6 328.533333 512 328.533333s183.466667 81.066667 183.466667 183.466667-81.066667 183.466667-183.466667 183.466667z"
                        data-spm-anchor-id="a313x.search_index.0.i0.40a93a81w1AXrL"></path>
                </svg>
            </button>
        </div>
    </header>

    <nav class="nav">

        <!-- Map -->
        <button class="nav-b active">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M9 3L3 6v14l6-3 6 3 6-3V3l-6 3-6-3zM5 7.3l3-1.5v11.4l-3 1.5V7.3zm5.5 9.9V5.8l5 2.5v11.4l-5-2.5zm6.5 0V5.8l2-1v11.4l-2 1z" />
                </svg>
                <span class="notif-dot"></span>
            </div>
            <span class="gamefont nav-text">Map</span>
            <span class="active-ind"></span>
        </button>

        <!-- Jounal -->
        <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M19 3H7c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 14H9v-2h8v2zm0-4H9v-2h8v2zm0-4H9V7h8v2z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Journal</span>
        </button>

        <!-- Friends -->
        <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Friends</span>
        </button>

        <!-- Achievements / or some shit ill change lter-->
        <button class="nav-b">
            <div class="icon-warp">
                <svg class="map-icon" viewBox="0 0 24 24">
                    <path
                        d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                </svg>
            </div>
            <span class="gamefont nav-text">Achievements</span>
        </button>
    </nav>

    <div class="level-pin">
        <div class="wooden-sign">
            <span class="nail tl"></span>
            <span class="nail tr"></span>
            <span class="nail bl"></span>
            <span class="nail br"></span>
            <span class="gamefont sign-text">1. idk</span>
        </div>


        <button class="node">
            <div class="rim">
                <div class="face">
                    <span class="gamefont node-no">1</span>
                </div>
            </div>
        </button>
    </div>


    <div class="mission-card" id="missioncard">
        <div class="mission-thumb-wrap">
            <img id="mission-thumb" src="" alt="MissionLocation" class="mission-thumb" />
        </div>

        <div class="mission-info">
            <span class="gamefont lvlbadge" id="lvlbadge"></span>
            <h2 class="gamefont title" id="title"></h2>
        </div>

        <div class="dist-row">
            <svg class="dist-icon" viewBox="0 0 24 24">
                <path
                    d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" />
            </svg>
            <span class="dist-text" id="distance"></span>
        </div>

        <p class="desc" id="desc"></p>

        <div class="reward">
            <svg class="leaf-icon" viewBox="0 0 24 24">
                <path
                    d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.22V8c4.25-1 8-1 8-1s-3.5 1.5-6.5 3c-.5.25-.8.5-1 .78C8.5 16 11 18 16 17c1.5-.3 3.5-1.5 4.5-2.5-1 .5-2 1-3.5 1.5z" />
            </svg>
            <span class="reward-text" id="xp"></span>
        </div>

        <button class="start-btn" id="startbtn">
            <span class="gamefont">Accept</span>
        </button>
    </div>
</body>


</html>
